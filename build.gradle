plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.tmi'
version = '0.0.1-SNAPSHOT'
description = 'project-tmi core'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// 아키텍처 규칙 검증 (docs/ai/architecture-proposal.md §5). JUnit 엔진 대신 core 만 사용 — 규칙은 일반 @Test 에서 check()
	testImplementation 'com.tngtech.archunit:archunit:1.5.1'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 포맷 검사 (docs/ai/conventions-proposal.md §7).
// 기존 src/main 은 이 작업 범위에서 수정할 수 없어 아직 포맷되지 않았다 → check/build 에 묶지 않는다 (enforceCheck = false).
// 수동 실행: bash ./gradlew spotlessCheck / spotlessApply. 전환 조건은 docs/ai/decisions-needed.md D5.
spotless {
	enforceCheck = false
	java {
		target 'src/*/java/**/*.java'
		palantirJavaFormat('2.102.0')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}
